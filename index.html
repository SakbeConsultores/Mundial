<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mundial 2026" />
    <meta name="theme-color" content="#c9a227" />
    <title>Mundial 2026 · Dashboard</title>
    <link rel="manifest" href="/Mundial/manifest.json" />
    <link rel="apple-touch-icon" href="/Mundial/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Mundial/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        background: #0a0f1e;
        -webkit-overflow-scrolling: touch;
      }
      input[type=number] {
        -webkit-appearance: none;
        -moz-appearance: textfield;
        appearance: textfield;
      }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      button, input {
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Unregister any existing service workers to fix Safari caching issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('SW unregistered');
          }
        });
      }
    </script>
  </body>
</html>
